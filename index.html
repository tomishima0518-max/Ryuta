<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>地震体験VR - リアル歩行＆イベント型</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene webxr="optionalFeatures: hit-test, local-floor">
        <a-entity id="rig" position="0 0 0">
            <a-entity id="camera" camera look-controls="reverseMouseDrag: false" position="0 1.6 0">
                <a-entity cursor="fuse: true; fuseTimeout: 1000" position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.01" 
                          material="color: #FF5722; shader: flat">
                    <a-entity geometry="primitive: box; width: 0.002; height: 0.03; depth: 0.002" material="color: #FF5722"></a-entity>
                    <a-entity geometry="primitive: box; width: 0.03; height: 0.002; depth: 0.002" material="color: #FF5722"></a-entity>
                </a-entity>
            </a-entity>
        </a-entity>
        <a-entity id="trigger-area" position="0 0 -4">
            <a-cylinder radius="1" height="0.1" material="color: #FF0000; opacity: 0.5; transparent: true"></a-cylinder>
            <a-text value="ここに入ると地震開始" align="center" position="0 1.5 0" color="white"></a-text>
        </a-entity>
        <a-sky color="#222"></a-sky>
        <a-grid width="50" height="50" material="color: #444"></a-grid>
    </a-scene>
    <script>
        const rig = document.getElementById('rig');
        const camera = document.getElementById('camera');
        const trigger = document.getElementById('trigger-area');
        let isQuaking = false;
        function tick() {
            const pos = rig.object3D.position;
            const targetPos = trigger.object3D.position;
            const distance = Math.sqrt(Math.pow(pos.x - targetPos.x, 2) + Math.pow(pos.z - targetPos.z, 2));
            if (distance < 1.2 && !isQuaking) { startEarthquake(); }
            if (isQuaking) {
                const intensity = 0.15;
                camera.object3D.position.x = (Math.random() - 0.5) * intensity;
                camera.object3D.position.y = 1.6 + (Math.random() - 0.5) * intensity;
                camera.object3D.position.z = (Math.random() - 0.5) * intensity;
            }
            requestAnimationFrame(tick);
        }
        function startEarthquake() {
            isQuaking = true;
            setTimeout(() => {
                isQuaking = false;
                camera.object3D.position.set(0, 1.6, 0);
                alert("避難成功！進捗を保存しました。");
                localStorage.setItem("earthquake_cleared", "true");
            }, 5000);
        }
        tick();
    </script>
</body>
</html>
