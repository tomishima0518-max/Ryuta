<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Roblox Obby - センサー移動版</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene fog="type: linear; color: #a3d5ff; far: 40; near: 0">
        
        <a-entity id="rig" position="0 0 5">
            <a-entity id="camera" camera look-controls position="0 1.6 0">
                <a-entity cursor="fuse: false" position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015" 
                          material="color: white; shader: flat">
                </a-entity>
            </a-entity>
        </a-entity>

        <a-box position="0 -0.5 5" width="4" height="0.1" depth="4" color="#32CD32" material="shader: flat"></a-box>
        
        <a-box position="0 -0.5 1" width="2" height="0.1" depth="2" color="#FFD700" material="shader: flat"></a-box>
        <a-box position="2 -0.5 -3" width="2" height="0.1" depth="2" color="#FF4500" material="shader: flat"></a-box>
        <a-box position="-2 -0.5 -7" width="2" height="0.1" depth="2" color="#1E90FF" material="shader: flat"></a-box>

        <a-entity id="goal-area" position="0 -0.5 -12">
            <a-box width="5" height="0.1" depth="5" color="#FF69B4" material="shader: flat"></a-box>
            <a-text value="GOAL!!" align="center" position="0 2 0" color="white" width="10"></a-text>
        </a-entity>

        <a-sky color="#a3d5ff"></a-sky>
    </a-scene>

    <script>
        const rig = document.getElementById('rig');
        const camera = document.getElementById('camera');
        let speed = 0;

        // オートセーブ/ロード
        if(localStorage.getItem("obby_progress")) {
            console.log("セーブデータを確認しました");
        }

        function tick() {
            // カメラの傾き（ピッチ）を取得
            const rotation = camera.getAttribute('rotation');
            
            // 【移動の仕組み】
            // スマホを前に20度以上傾けると、向いている方向に進む
            if (rotation.x < -20) {
                speed = 0.05; // 移動速度
            } else {
                speed = 0; // 平行に戻すと止まる
            }

            if (speed > 0) {
                // 向いている方向ベクトルを計算
                const direction = new THREE.Vector3(0, 0, -1);
                direction.applyQuaternion(camera.object3D.quaternion);
                direction.y = 0; // 上下移動は制限
                direction.normalize();
                
                // リグ（プレイヤー全体）を移動
                rig.object3D.position.addScaledVector(direction, speed);
            }

            // ゴール判定
            const dist = rig.object3D.position.distanceTo(new THREE.Vector3(0, 0, -12));
            if (dist < 2.5) {
                localStorage.setItem("obby_progress", "cleared");
                // 簡易的なゴール演出
                rig.setAttribute('position', '0 0 5'); // スタートに戻す
                alert("クリア！オートセーブしました。");
            }

            requestAnimationFrame(tick);
        }
        tick();
    </script>
</body>
</html>
