<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Roblox Zombie Survival VR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene fog="type: linear; color: #111; far: 30; near: 0">
        
        <a-entity id="rig" position="0 0 5">
            <a-entity id="camera" camera look-controls position="0 1.6 0">
                <a-entity cursor="fuse: true; fuseTimeout: 500" position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03" 
                          material="color: #00FF00; shader: flat">
                    <a-animation attribute="scale" begin="cursor-fusing" easing="ease-in" dur="500" from="1 1 1" to="0.1 0.1 0.1"></a-animation>
                </a-entity>
            </a-entity>
        </a-entity>

        <a-plane rotation="-90 0 0" width="100" height="100" color="#222" material="shader: flat"></a-plane>

        <a-entity id="zombie" position="0 0 -5" class="enemy">
            <a-box position="0 1.5 0" width="0.8" height="1.8" depth="0.5" color="#4CAF50" material="shader: flat"></a-box> <a-box position="0 2.6 0" width="0.5" height="0.5" depth="0.5" color="#2E7D32" material="shader: flat"></a-box> <a-text id="zombie-hp" value="HP: 3" align="center" position="0 3.2 0" color="red" width="4"></a-text>
        </a-entity>

        <a-sky color="#000"></a-sky>
    </a-scene>

    <script>
        const rig = document.getElementById('rig');
        const camera = document.getElementById('camera');
        const zombie = document.getElementById('zombie');
        const hpText = document.getElementById('zombie-hp');
        
        let zombieHP = 3;
        let isJumping = false;
        let velocityY = 0;

        // 【自動ロード】
        const savedScore = localStorage.getItem("zombie_kill_count") || 0;
        console.log("倒した数: " + savedScore);

        // ゾンビへの攻撃（カーソルで一定時間見つめると発動）
        zombie.addEventListener('click', () => {
            if (zombieHP > 0) {
                zombieHP -= 1;
                hpText.setAttribute('value', `HP: ${zombieHP}`);
                
                // ダメージ演出（赤くなる）
                zombie.querySelectorAll('a-box').forEach(el => el.setAttribute('color', 'red'));
                setTimeout(() => {
                    if(zombieHP > 0) zombie.querySelectorAll('a-box').forEach(el => el.setAttribute('color', '#4CAF50'));
                }, 200);

                if (zombieHP <= 0) {
                    zombie.setAttribute('visible', 'false');
                    alert("ゾンビを倒した！");
                    // 【オートセーブ】
                    localStorage.setItem("zombie_kill_count", Number(savedScore) + 1);
                }
            }
        });

        function tick() {
            // 移動（前回のスマホ傾き移動）
            const rotation = camera.getAttribute('rotation');
            if (rotation.x < -20) {
                const dir = new THREE.Vector3(0, 0, -0.05).applyQuaternion(camera.object3D.quaternion);
                rig.object3D.position.x += dir.x;
                rig.object3D.position.z += dir.z;
            }

            // ゾンビがゆっくり追いかけてくる
            if (zombieHP > 0) {
                const zPos = zombie.object3D.position;
                const pPos = rig.object3D.position;
                const angle = Math.atan2(pPos.x - zPos.x, pPos.z - zPos.z);
                zPos.x += Math.sin(angle) * 0.01;
                zPos.z += Math.cos(angle) * 0.01;
            }

            requestAnimationFrame(tick);
        }
        tick();
    </script>
</body>
</html>
