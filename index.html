<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Roblox Obby - Jump Edition</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene fog="type: linear; color: #a3d5ff; far: 40; near: 0">
        
        <a-entity id="rig" position="0 0 5">
            <a-entity id="camera" camera look-controls position="0 1.6 0">
                <a-entity cursor="fuse: false" position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015" 
                          material="color: white; shader: flat">
                </a-entity>
            </a-entity>
        </a-entity>

        <a-box position="0 -0.5 5" width="4" height="0.1" depth="4" color="#32CD32" material="shader: flat"></a-box>
        <a-box position="0 -0.5 1" width="2" height="0.1" depth="2" color="#FFD700" material="shader: flat"></a-box>
        <a-box position="0 -0.5 -3" width="2" height="0.1" depth="2" color="#FF4500" material="shader: flat"></a-box>
        <a-box position="0 -0.5 -7" width="2" height="0.1" depth="2" color="#1E90FF" material="shader: flat"></a-box>

        <a-sky color="#a3d5ff"></a-sky>
    </a-scene>

    <script>
        const rig = document.getElementById('rig');
        const camera = document.getElementById('camera');
        
        let velocityY = 0;
        let isJumping = false;
        const gravity = -0.01;
        const jumpForce = 0.2;

        // 【自動ロード】前回のクリア状況を確認
        if(localStorage.getItem("obby_cleared")) {
            console.log("おかえりなさい！");
        }

        // ジャンプのトリガー（画面タップ）
        window.addEventListener('click', () => {
            if (!isJumping) {
                velocityY = jumpForce;
                isJumping = true;
            }
        });

        // ジャンプのトリガー（スマホを振る検知）
        let lastY = 0;
        window.addEventListener('devicemotion', (event) => {
            let acc = event.accelerationIncludingGravity;
            if (acc && Math.abs(acc.y - lastY) > 5) { // 縦に振ったら
                if (!isJumping) {
                    velocityY = jumpForce;
                    isJumping = true;
                }
            }
            lastY = acc.y;
        });

        function tick() {
            // --- 移動処理 (前回と同じ：傾けると進む) ---
            const rotation = camera.getAttribute('rotation');
            if (rotation.x < -20) {
                const direction = new THREE.Vector3(0, 0, -0.06);
                direction.applyQuaternion(camera.object3D.quaternion);
                rig.object3D.position.x += direction.x;
                rig.object3D.position.z += direction.z;
            }

            // --- ジャンプ・物理処理 ---
            if (isJumping || rig.object3D.position.y > 0) {
                velocityY += gravity;
                rig.object3D.position.y += velocityY;

                // 地面（高さ0）に着地
                if (rig.object3D.position.y <= 0) {
                    rig.object3D.position.y = 0;
                    isJumping = false;
                    velocityY = 0;
                    // 【オートセーブ】着地するたびに位置を保存
                    localStorage.setItem("last_pos", JSON.stringify(rig.object3D.position));
                }
            }

            requestAnimationFrame(tick);
        }
        tick();
    </script>
</body>
</html>
