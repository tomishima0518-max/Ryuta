<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Roblox風 Obby VR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene fog="type: linear; color: #a3d5ff; far: 30; near: 0">
        
        <a-entity id="rig" position="0 0 5">
            <a-entity id="camera" camera look-controls position="0 1.6 0">
                <a-entity cursor="fuse: false" position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015" 
                          material="color: white; shader: flat">
                </a-entity>
            </a-entity>
        </a-entity>

        <a-box position="0 -0.5 5" width="3" height="0.1" depth="3" color="#32CD32"></a-box>
        <a-text value="START OBBY" align="center" position="0 1 3.5" color="#333" width="6"></a-text>

        <a-box class="platform" position="0 -0.5 2" width="1.5" height="0.1" depth="1.5" color="#FFD700"></a-box>
        <a-box class="platform" position="1.5 -0.5 -1" width="1.5" height="0.1" depth="1.5" color="#FF4500"></a-box>
        <a-box class="platform" position="-1.5 -0.5 -4" width="1.5" height="0.1" depth="1.5" color="#1E90FF"></a-box>

        <a-entity id="goal-area" position="0 -0.5 -8">
            <a-box width="4" height="0.1" depth="4" color="#FF69B4"></a-box>
            <a-text value="GOAL!!" align="center" position="0 2 0" color="white" width="10"></a-text>
        </a-entity>

        <a-sky color="#a3d5ff"></a-sky>
        <a-plane rotation="-90 0 0" width="1000" height="1000" color="#7BC8A4" position="0 -10 0"></a-plane>

    </a-scene>

    <script>
        const rig = document.getElementById('rig');
        const goal = document.getElementById('goal-area');
        let reachedGoal = false;

        // セーブデータ読み込み
        if(localStorage.getItem("obby_cleared") === "true") {
            console.log("Welcome back, Champion!");
        }

        function tick() {
            const playerPos = rig.object3D.position;
            const goalPos = new THREE.Vector3(0, 0, -8);

            // ゴール判定
            if (playerPos.distanceTo(goalPos) < 2 && !reachedGoal) {
                reachedGoal = true;
                // オートセーブ
                localStorage.setItem("obby_cleared", "true");
                alert("おめでとう！ゴールしました！進捗を保存しました。");
            }
            requestAnimationFrame(tick);
        }
        tick();
    </script>
</body>
</html>
