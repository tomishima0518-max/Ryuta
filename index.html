<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Roblox Obby - Solid Platforms</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene fog="type: linear; color: #a3d5ff; far: 40; near: 0">
        
        <a-entity id="rig" position="0 0 5">
            <a-entity id="camera" camera look-controls position="0 1.6 0">
                <a-text id="ui-msg" value="OBBY START" align="center" position="0 0.1 -1.5" color="#FFD700" width="3"></a-text>
            </a-entity>
        </a-entity>

        <a-entity id="platforms">
            <a-box class="step" position="0 -0.5 5" width="4" height="1" depth="4" color="#32CD32" material="shader: flat"></a-box>
            
            <a-box class="step" position="0 -0.5 1" width="2" height="1" depth="2" color="#FFD700" material="shader: flat"></a-box>
            <a-box class="step" position="2 -0.5 -2" width="1.5" height="1" depth="1.5" color="#FF4500" material="shader: flat"></a-box>
            <a-box class="step" position="-2 -0.5 -5" width="2" height="1" depth="2" color="#1E90FF" material="shader: flat"></a-box>
            
            <a-box id="goal-plate" class="step" position="0 -0.5 -10" width="4" height="1" depth="4" color="#FF69B4" material="shader: flat"></a-box>
        </a-entity>

        <a-sky color="#87CEEB"></a-sky>
    </a-scene>

    <script>
        const rig = document.getElementById('rig');
        const camera = document.getElementById('camera');
        const platforms = document.querySelectorAll('.step');
        
        let velocityY = 0;
        let isJumping = false;
        const gravity = -0.012;
        const jumpForce = 0.22;

        // タップでジャンプ
        window.addEventListener('mousedown', () => {
            if (!isJumping) {
                velocityY = jumpForce;
                isJumping = true;
            }
        });

        function tick() {
            const pos = rig.object3D.position;
            const rot = camera.getAttribute('rotation');

            // 1. 移動（お辞儀で進む）
            if (rot.x < -15) {
                const dir = new THREE.Vector3(0, 0, -0.07).applyQuaternion(camera.object3D.quaternion);
                pos.x += dir.x;
                pos.z += dir.z;
            }

            // 2. 物理計算（落下とジャンプ）
            velocityY += gravity;
            pos.y += velocityY;

            // 3. 強力な着地判定
            let hasLanded = false;
            platforms.forEach(p => {
                const pPos = p.object3D.position;
                const pWidth = p.getAttribute('width') / 2;
                const pDepth = p.getAttribute('depth') / 2;
                
                // ブロックの範囲内にいるか？
                if (Math.abs(pos.x - pPos.x) < pWidth && Math.abs(pos.z - pPos.z) < pDepth) {
                    // 足場の表面（y=0）付近にいて、落下中の場合
                    if (pos.y <= 0 && pos.y > -0.5 && velocityY < 0) {
                        pos.y = 0;
                        velocityY = 0;
                        isJumping = false;
                        hasLanded = true;
                    }
                }
            });

            // 4. 落下リセット
            if (pos.y < -4) {
                pos.set(0, 0, 5); // スタートに戻る
                velocityY = 0;
                isJumping = false;
                // オートセーブ：失敗を記録
                localStorage.setItem("last_fail_pos", "stage1");
            }

            requestAnimationFrame(tick);
        }
        tick();
    </script>
</body>
</html>
