<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Roblox Obby VR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <a-scene fog="type: linear; color: #a3d5ff; far: 40; near: 0">
        
        <a-entity id="rig" position="0 0 5">
            <a-entity id="camera" camera look-controls position="0 1.6 0">
                <a-text id="ui-stage" value="STAGE: 1" position="0.5 0.5 -1" color="white" width="2"></a-text>
                <a-text id="ui-msg" value="TAP TO JUMP" align="center" position="0 0.1 -1.5" color="#FFD700" width="3"></a-text>
            </a-entity>
        </a-entity>

        <a-box class="checkpoint" position="0 -0.5 5" width="4" height="0.1" depth="4" color="#32CD32"></a-box>
        
        <a-box class="platform" position="0 -0.5 1" width="2" height="0.1" depth="2" color="#FFD700"></a-box>
        <a-box class="platform" position="2 -0.5 -2" width="1.5" height="0.1" depth="1.5" color="#FF4500"></a-box>
        <a-box class="platform" position="-2 -0.5 -5" width="2" height="0.1" depth="2" color="#1E90FF"></a-box>
        
        <a-box id="kill-part" position="0 -1.5 -8" width="10" height="0.1" depth="2" color="#FF0000"></a-box>

        <a-entity id="goal" position="0 -0.5 -12">
            <a-box width="5" height="0.1" depth="5" color="#FF69B4"></a-box>
            <a-text value="GOAL!!" align="center" position="0 2 0" color="white" width="10"></a-text>
        </a-entity>

        <a-sky color="#a3d5ff"></a-sky>
    </a-scene>

    <script>
        const rig = document.getElementById('rig');
        const camera = document.getElementById('camera');
        let velocityY = 0;
        let isJumping = false;
        const gravity = -0.012;
        const jumpForce = 0.22;

        // 【自動ロード】
        if(localStorage.getItem("obby_cleared") === "true") {
            document.getElementById('ui-msg').setAttribute('value', "WELCOME BACK!");
        }

        // ジャンプ操作（画面タップ）
        window.addEventListener('mousedown', () => {
            if (!isJumping) {
                velocityY = jumpForce;
                isJumping = true;
            }
        });

        function tick() {
            const rot = camera.getAttribute('rotation');
            const pos = rig.object3D.position;

            // 移動（お辞儀で前進）
            if (rot.x < -15) {
                const dir = new THREE.Vector3(0, 0, -0.07).applyQuaternion(camera.object3D.quaternion);
                pos.x += dir.x;
                pos.z += dir.z;
            }

            // ジャンプと重力
            if (isJumping || pos.y > 0) {
                velocityY += gravity;
                pos.y += velocityY;
                if (pos.y <= 0) {
                    pos.y = 0;
                    isJumping = false;
                    velocityY = 0;
                }
            }

            // 落下・リセット判定（高さがマイナスになったらスタートへ）
            if (pos.y < -1 || pos.distanceTo(document.getElementById('kill-part').object3D.position) < 2) {
                pos.set(0, 0, 5); // スタートに戻る
                velocityY = 0;
                document.getElementById('ui-msg').setAttribute('value', "OOPS! RESET");
                setTimeout(() => document.getElementById('ui-msg').setAttribute('value', ""), 1000);
            }

            // ゴール判定
            if (pos.distanceTo(new THREE.Vector3(0, 0, -12)) < 2.5) {
                localStorage.setItem("obby_cleared", "true"); // オートセーブ
                document.getElementById('ui-msg').setAttribute('value', "OBBY CLEAR!");
            }

            requestAnimationFrame(tick);
        }
        tick();
    </script>
</body>
</html>
